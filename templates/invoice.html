<!DOCTYPE html>
<html>
<head>
    <title>Invoice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        /* ✅ PRINT FIX */
        @media print {
            button {
                display: none;
            }

            body {
                margin: 0;
            }
        }
    </style>
</head>

<body>

<div id="invoice">

<h2>Invoice</h2>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Batch</th>
        <th>Qty</th>
        <th>Rate</th>
        <th>Total</th>
    </tr>

    {% for item in items %}
    <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.batch }}</td>
        <td>{{ item.qty }}</td>
        <td>{{ item.rate }}</td>
        <td>{{ item.amount }}</td>
    </tr>
    {% endfor %}
</table>

<h3>Total: ₹{{ total }}</h3>

</div>

<br>
<button onclick="window.print()">Print</button>

</body>
</html>
