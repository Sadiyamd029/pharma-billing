<!DOCTYPE html>
<html>
<head>
    <title>Invoice</title>
</head>
<body>

<h2>Invoice</h2>

<table border="1" cellpadding="8">
    <tr>
        <th>Name</th>
        <th>Batch</th>
        <th>Qty</th>
        <th>Rate</th>
        <th>Total</th>
    </tr>

    {% for item in items %}
    <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.batch }}</td>
        <td>{{ item.qty }}</td>
        <td>{{ item.rate }}</td>
        <td>{{ item.amount }}</td>
    </tr>
    {% endfor %}
</table>

<h3>Total: {{ total }}</h3>

<br>
<button onclick="window.print()">Print</button>

</body>
</html>
