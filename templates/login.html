<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Pharma System</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

/* 🌌 Background */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top, #1e3c72, #0f2027);
    overflow:hidden;
}

/* 🎇 Particles canvas */
#particles-js{
    position:absolute;
    width:100%;
    height:100%;
    z-index:0;
}

/* 💎 Glass Card */
.login-box{
    position:relative;
    z-index:2;
    width:320px;
    padding:30px;
    border-radius:20px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    text-align:center;
    animation: fadeIn 1s ease;
}

/* Title */
.login-box h2{
    color:white;
    margin-bottom:20px;
}

/* Floating Input */
.input-group{
    position:relative;
    margin:20px 0;
}

.input-group input{
    width:100%;
    padding:12px;
    border:none;
    outline:none;
    border-radius:10px;
    background: rgba(255,255,255,0.1);
    color:white;
}

.input-group label{
    position:absolute;
    top:50%;
    left:12px;
    transform:translateY(-50%);
    color:#ccc;
    pointer-events:none;
    transition:0.3s;
}

/* ✨ Floating Effect */
.input-group input:focus + label,
.input-group input:valid + label{
    top:-8px;
    left:10px;
    font-size:12px;
    color:#00f2fe;
}

/* 👁 Password Toggle */
.eye{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#ccc;
}

/* 🔘 Button */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background: linear-gradient(45deg, #00f2fe, #4facfe);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* ✨ Animation */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<!-- 🌌 Particles -->
<div id="particles-js"></div>

<!-- 💎 Login Box -->
<div class="login-box">

    <h2>💊 Pharma System</h2>

    <form method="POST">

        <div class="input-group">
            <input type="text" name="username" required>
            <label>Username</label>
        </div>

        <div class="input-group">
            <input type="password" name="password" id="password" required>
            <label>Password</label>
            <span class="eye" onclick="togglePassword()">👁</span>
        </div>

        <button type="submit">Login</button>

    </form>

</div>

<!-- 🔥 Particles JS -->
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<script>
particlesJS("particles-js", {
    "particles": {
        "number": { "value": 60 },
        "size": { "value": 3 },
        "move": { "speed": 1 },
        "line_linked": { "enable": true }
    }
});
</script>

<!-- 👁 Toggle Password -->
<script>
function togglePassword(){
    let pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}
</script>

</body>
