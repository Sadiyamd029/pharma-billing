{% extends "base.html" %}
{% block content %}

<style>
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    text-align: center;
}

th {
    font-size: 12px;
}

td input {
    min-width: 60px;
}

@media print {
    body { background: white !important; color: black !important; }
    .navbar, button, a { display: none !important; }
    #invoice { display: block; width: 100%; margin: 0; padding: 0; }
    .card { box-shadow: none; background: white; }
}
</style>

<div class="card">
<h2>Billing</h2>

<datalist id="medList"></datalist>
<datalist id="partyList"></datalist>

<form action="/invoice" method="POST">
<input name="party" list="partyList" placeholder="Party Name" id="partyNameInput"><br><br>
<input name="party_address" id="partyAddress" placeholder="Party Address"><br><br>
<div style="display:flex; gap:10px;">
    <input name="party_gstin" id="partyGstin" placeholder="Party GSTIN">
    <input name="party_phone" id="partyPhone" placeholder="Party Phone">
    <input name="party_state" id="partyState" placeholder="State">
</div><br>
<div style="display:flex; gap:10px;">
    <input name="party_d20b" id="partyD20b" placeholder="Party D20B License">
    <input name="party_d21b" id="partyD21b" placeholder="Party D21B License">
</div><br>
<select name="mode" style="width:150px; margin-bottom:15px;">
    <option value="Cash">Cash</option>
    <option value="Credit">Credit</option>
</select><br><br>

<table id="billTable">
<tr>
<th>Medicine</th>
<th>MFR</th>
<th>HSN</th>
<th>Pack</th>
<th>Batch</th>
<th>Ex.Dt</th>
<th>MRP</th>
<th>Qty</th>
<th>Free</th>
<th>Rate</th>
<th>Disc %</th>
<th>GST %</th>
</tr>

<tr>
<td><input name="name" list="medList"></td>
<td><input name="mfr"></td>
<td><input name="hsn"></td>
<td><input name="pack"></td>
<td><input name="batch"></td>
<td><input name="expiry"></td>
<td><input name="mrp"></td>
<td><input name="qty"></td>
<td><input name="free" placeholder="0"></td>
<td><input name="rate"></td>
<td><input name="disc" placeholder="0"></td>
<td><input name="gst" placeholder="0"></td>
</tr>

</table>

<br>
<button type="button" onclick="addRow()">+ Add Row</button>
<button type="submit">Generate Bill</button>

</form>
</div>

<!-- ✅ INVOICE SECTION -->
<div class="card" id="invoice">
<h3 style="text-align:center;">Invoice</h3>

<table border="1">
<tr>
<th>Name</th>
<th>Batch</th>
<th>Qty</th>
<th>Total</th>
</tr>

{% for i in items %}
<tr>
<td>{{ i.name }}</td>
<td>{{ i.batch }}</td>
<td>{{ i.qty }}</td>
<td>{{ i.amount }}</td>
</tr>
{% endfor %}

</table>

<h3 style="text-align:right;">Total: ₹{{ total }}</h3>

<button onclick="window.print()">🖨 Print</button>
</div>

<script>
let medicineData = [];
let partyData = [];

function medLabel(m){
    return `${m.name} — ${m.batch} — Exp ${m.expiry || 'NA'} — Stock ${m.stock}`;
}

async function loadMedicines(){
    try{
        let res = await fetch('/api/medicines');
        medicineData = await res.json();
        let dl = document.getElementById('medList');
        dl.innerHTML = '';
        medicineData.forEach(m => {
            let opt = document.createElement('option');
            opt.value = medLabel(m);
            dl.appendChild(opt);
        });
    }catch(e){ console.log('medicine list error', e); }
}

async function loadParties(){
    try{
        let res = await fetch('/api/parties');
        partyData = await res.json();
        let dl = document.getElementById('partyList');
        dl.innerHTML = '';
        partyData.forEach(p => {
            let opt = document.createElement('option');
            opt.value = p.name;
            dl.appendChild(opt);
        });
    }catch(e){ console.log('party list error', e); }
}

function autofillRow(row, typedValue){
    let match = medicineData.find(m => medLabel(m) === typedValue);
    if(!match) return;

    row.querySelector('[name="name"]').value = match.name;
    row.querySelector('[name="mfr"]').value = match.mfr || '';
    row.querySelector('[name="hsn"]').value = match.hsn || '';
    row.querySelector('[name="pack"]').value = match.pack || '';
    row.querySelector('[name="batch"]').value = match.batch || '';
    row.querySelector('[name="expiry"]').value = match.expiry || '';
    row.querySelector('[name="mrp"]').value = match.mrp || '';
    row.querySelector('[name="rate"]').value = match.rate || '';
    row.querySelector('[name="gst"]').value = match.gst || '';
}

function autofillParty(typedValue){
    let match = partyData.find(p => p.name === typedValue);
    if(!match) return;

    document.getElementById('partyAddress').value = match.address || '';
    document.getElementById('partyGstin').value = match.gstin || '';
    document.getElementById('partyPhone').value = match.phone || '';
    document.getElementById('partyState').value = match.state || '';
    document.getElementById('partyD20b').value = match.d20b || '';
    document.getElementById('partyD21b').value = match.d21b || '';
}

document.getElementById('billTable').addEventListener('input', function(e){
    if(e.target.name === 'name'){
        autofillRow(e.target.closest('tr'), e.target.value);
    }
});

document.getElementById('partyNameInput').addEventListener('input', function(e){
    autofillParty(e.target.value);
});

function addRow(){
    let row = document.getElementById("billTable").insertRow();
    row.innerHTML = `
    <td><input name="name" list="medList"></td>
    <td><input name="mfr"></td>
    <td><input name="hsn"></td>
    <td><input name="pack"></td>
    <td><input name="batch"></td>
    <td><input name="expiry"></td>
    <td><input name="mrp"></td>
    <td><input name="qty"></td>
    <td><input name="free" placeholder="0"></td>
    <td><input name="rate"></td>
    <td><input name="disc" placeholder="0"></td>
    <td><input name="gst" placeholder="0"></td>`;
}

loadMedicines();
loadParties();
</script>

{% endblock %}
