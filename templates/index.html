<!DOCTYPE html>
<html>
<head>
    <title>Pharma Billing</title>
</head>
<body>

<h2>Pharma Billing</h2>

<form method="POST" action="/billing">

    <div id="rows">
        <div>
            Name: <input type="text" name="name">
            Batch: <input type="text" name="batch">
            Qty: <input type="number" name="qty">
            Rate: <input type="number" name="rate">
        </div>
    </div>

    <br>
    <button type="button" onclick="addRow()">Add Row</button>
    <button type="submit">Generate Bill</button>

</form>

<script>
function addRow() {
    let div = document.createElement("div");
    div.innerHTML = `
        Name: <input type="text" name="name">
        Batch: <input type="text" name="batch">
        Qty: <input type="number" name="qty">
        Rate: <input type="number" name="rate">
    `;
    document.getElementById("rows").appendChild(div);
}
</script>

</body>
</html>
