{% extends "base.html" %}
{% block content %}

<div class="card">
<h2>Billing</h2>

<!-- ✅ FIXED FORM -->
<form method="POST" action="/">

<input name="party" placeholder="Party Name"><br><br>

<table id="billTable">
<tr>
<th>Medicine</th>
<th>Batch</th>
<th>Expiry</th>
<th>Qty</th>
<th>Rate</th>
<th>GST</th>
</tr>

<tr>
<td><input name="name"></td>
<td><input name="batch"></td>
<td><input type="date" name="expiry"></td>
<td><input name="qty"></td>
<td><input name="rate"></td>
<td><input name="gst"></td>
</tr>
</table>

<br>
<button type="button" onclick="addRow()">+ Add Row</button>
<button type="submit">Generate Bill</button>

</form>
</div>


<!-- ✅ INVOICE SECTION -->
<div class="card" id="invoice">
<h3 style="text-align:center;">💊 Pharma Invoice</h3>

<p><b>Party:</b> {{ request.form.party }}</p>

<table border="1" style="width:100%; border-collapse:collapse;">
<tr>
<th>Name</th>
<th>Batch</th>
<th>Qty</th>
<th>Total</th>
</tr>

{% for i in items %}
<tr>
<td>{{ i.name }}</td>
<td>{{ i.batch }}</td>
<td>{{ i.qty }}</td>
<td>{{ i.amount }}</td>
</tr>
{% endfor %}

</table>

<h3>Total: ₹{{ total }}</h3>
<br>

<button onclick="printBill()">🖨 Print</button>

<a href="/download_pdf?items={{ items | tojson | safe }}">
    <button type="button">⬇ Download PDF</button>
</a>

</div>


<script>

/* ✅ PRINT ONLY INVOICE (FIXED) */
function printBill() {
    let content = document.getElementById("invoice").innerHTML;
    let original = document.body.innerHTML;

    document.body.innerHTML = content;
    window.print();
    document.body.innerHTML = original;
    location.reload();
}

/* ✅ ADD ROW */
function addRow(){
    let row = document.getElementById("billTable").insertRow();
    row.innerHTML = `
    <td><input name="name"></td>
    <td><input name="batch"></td>
    <td><input type="date" name="expiry"></td>
    <td><input name="qty"></td>
    <td><input name="rate"></td>
    <td><input name="gst"></td>`;
}

</script>

{% endblock %}
