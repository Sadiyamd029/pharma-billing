{% extends "base.html" %}
{% block content %}

<style>
/* Table styling */
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    text-align: center;
}

/* ✅ PRINT FIX */
@media print {

    body {
        background: white !important;
        color: black !important;
    }

    .navbar, button, a {
        display: none !important;
    }

    #invoice {
        display: block;
        width: 100%;
        margin: 0;
        padding: 0;
    }

    .card {
        box-shadow: none;
        background: white;
    }
}
</style>


<div class="card">
<h2>Billing</h2>

<form method="POST">

<input name="party" placeholder="Party Name"><br><br>

<table id="billTable">
<tr>
<th>Medicine</th>
<th>Batch</th>
<th>Qty</th>
<th>Rate</th>
<th>GST</th>
</tr>

<tr>
<td><input name="name"></td>
<td><input name="batch"></td>
<td><input name="qty"></td>
<td><input name="rate"></td>
<td><input name="gst"></td>
</tr>

</table>

<br>
<button type="button" onclick="addRow()">+ Add Row</button>
<button type="submit">Generate Bill</button>

</form>
</div>


<!-- ✅ INVOICE SECTION -->
<div class="card" id="invoice">
<h3 style="text-align:center;">Invoice</h3>

<table border="1">
<tr>
<th>Name</th>
<th>Batch</th>
<th>Qty</th>
<th>Total</th>
</tr>

{% for i in items %}
<tr>
<td>{{ i.name }}</td>
<td>{{ i.batch }}</td>
<td>{{ i.qty }}</td>
<td>{{ i.amount }}</td>
</tr>
{% endfor %}

</table>

<h3 style="text-align:right;">Total: ₹{{ total }}</h3>

<button onclick="window.print()">🖨 Print</button>
</div>


<script>
function addRow(){
    let row = document.getElementById("billTable").insertRow();
    row.innerHTML = `
    <td><input name="name"></td>
    <td><input name="batch"></td>
    <td><input name="qty"></td>
    <td><input name="rate"></td>
    <td><input name="gst"></td>`;
}
</script>

{% endblock %}
