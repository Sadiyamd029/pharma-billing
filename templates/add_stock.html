{% extends "base.html" %}
{% block content %}

<div class="card">
<h2>Add Stock</h2>

<form method="POST">
<input name="name" placeholder="Medicine"><br><br>
<input name="batch" placeholder="Batch"><br><br>
<input type="date" name="expiry"><br><br>
<input name="stock" placeholder="Stock"><br><br>

<button>Add Stock</button>
</form>
</div>

<div class="card">
<h3>All Medicines</h3>

<table>
<tr>
<th>Name</th><th>Batch</th><th>Expiry</th><th>Stock</th><th>Actions</th>
</tr>

{% for m in medicines %}
<tr style="{{ 'color:#f87171;' if m['stock']|int < 5 else '' }}">
<td>{{ m['name'] }}</td>
<td>{{ m['batch'] }}</td>
<td>{{ m['expiry'] }}</td>
<td>{{ m['stock'] }}</td>
<td>
    <a href="/edit/{{ m['name'] }}/{{ m['batch'] }}"><button>Edit</button></a>
    <a href="/delete/{{ m['name'] }}/{{ m['batch'] }}"><button style="background:red;">Delete</button></a>
</td>
</tr>
{% endfor %}

</table>
</div>

{% endblock %}
