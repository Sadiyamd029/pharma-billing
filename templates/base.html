<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ title }}</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background: radial-gradient(circle at top, #1e3c72, #0f2027);
    color:white;
}

/* 🌌 particles */
#particles-js{
    position:fixed;
    width:100%;
    height:100%;
    z-index:0;
}

/* 🌐 navbar */
.navbar{
    position:sticky;   /* ✅ ADDED */
    top:0;             /* ✅ ADDED */
    z-index:2;
    display:flex;
    justify-content:space-between;
    padding:15px 40px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
}

/* ✅ Navbar hover effect */
.navbar a{
    color:white;
    text-decoration:none;
    margin-right:15px;
    transition:0.3s;
}

.navbar a:hover{
    color:#00f2fe;
}

/* 💎 card */
.card{
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border-radius:20px;
    padding:20px;
    margin:20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    transition: 0.3s;
}

.card:hover{
    transform: translateY(-5px);
}

/* 📊 layout */
.container{
    position:relative;
    z-index:2;
    padding:20px;
}

/* ✅ table improved */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th{
    background: rgba(255,255,255,0.1);
}

th, td{
    padding:10px;
    border-bottom:1px solid rgba(255,255,255,0.2);
}

tr:hover{
    background: rgba(255,255,255,0.05);
}

/* ✅ button upgrade */
button{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background: linear-gradient(45deg,#00f2fe,#4facfe);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform: scale(1.05);
    box-shadow: 0 0 10px #00f2fe;
}

/* input */
input{
    width:100%;
    padding:8px;
    border-radius:8px;
    border:none;
    background: rgba(255,255,255,0.1);
    color:white;

    /* 🖨 PRINT FIX */
@media print {

    body {
        background: white !important;
        color: black !important;
    }

    #particles-js,
    .navbar,
    button,
    a {
        display: none !important;
    }

    .card {
        background: white !important;
        box-shadow: none !important;
        border: 1px solid #ccc;
    }

    table, th, td {
        border: 1px solid black;
        color: black;
    }

    input {
        border: none;
        background: none;
        color: black;
    }
}
}

</style>
</head>

<body>

<div id="particles-js"></div>

<div class="navbar">
    <div>💊 Pharma System</div>
    <div>
        <a href="/billing">Billing</a>
        <a href="/add_stock">Stock</a>
        <a href="/alerts">Alerts</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">
{% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
<script>
particlesJS("particles-js", {
    particles: {
        number: { value: 60 },
        size: { value: 3 },
        move: { speed: 1 },
        line_linked: { enable: true }
    }
});
</script>

</body>
</html>
