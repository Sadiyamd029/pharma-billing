<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pharma System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

/* 🌌 background */
body{
    background: radial-gradient(circle at top, #1e3c72, #0f2027);
    color:white;
}

/* 🌐 navbar */
.navbar{
    display:flex;
    justify-content:space-between;
    padding:15px 40px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
}

.navbar a{
    color:white;
    text-decoration:none;
    margin-right:15px;
    font-weight:500;
}

/* 📦 container */
.container{
    padding:20px;
}

/* 💎 card */
.card{
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border-radius:20px;
    padding:20px;
    margin:20px;
}

/* 📊 table */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th, td{
    padding:10px;
    border-bottom:1px solid rgba(255,255,255,0.2);
}

/* 🔘 button */
button{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background: linear-gradient(45deg,#00f2fe,#4facfe);
    color:white;
    cursor:pointer;
}

/* ✏️ input */
input{
    width:100%;
    padding:8px;
    border-radius:8px;
    border:none;
    background: rgba(255,255,255,0.1);
    color:white;
}


/* ================= PRINT FIX ================= */

@media print {

    body{
        background:white !important;
        color:black !important;
    }

    /* ❌ hide unwanted */
    .navbar, button, a{
        display:none !important;
    }

    /* ✅ show only invoice */
    #invoice{
        display:block;
        width:100%;
        margin:0;
        padding:0;
    }

    .container{
        padding:0;
        margin:0;
    }

    .card{
        background:white;
        box-shadow:none;
        border:none;
        width:100%;
    }

    table{
        width:100%;
        font-size:16px;
    }

    h3{
        text-align:center;
    }
}

</style>
</head>

<body>

<!-- 🌐 Navbar -->
<div class="navbar">
    <div>💊 Pharma System</div>
    <div>
        <a href="/billing">Billing</a>
        <a href="/add_stock">Stock</a>
        <a href="/alerts">Alerts</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<!-- 📦 Page Content -->
<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
